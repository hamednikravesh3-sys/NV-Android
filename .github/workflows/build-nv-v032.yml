name: Build NV v0.32 User Friendly APK
# v0.32 user-friendly CI

concurrency:
  group: nv-v032-user-friendly-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - nv-v032-user-friendly
  workflow_dispatch:

jobs:
  build-v032:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout NV repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache
          python3 -m pip install --quiet pillow

      - name: Clone stable Organic Maps core
        run: |
          git clone --depth 1 --branch 2026.08.27-18-android --filter=blob:limit=128k https://github.com/organicmaps/organicmaps.git organicmaps
          cd organicmaps
          git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 8))

      - name: Integrate NV v0.32 user-friendly layer
        run: |
          set -euo pipefail
          python3 platform/patch_v032.py organicmaps
          python3 platform/patch_v027_resources.py organicmaps
          grep -q "appId = 'ir.nv.navigation'" organicmaps/android/build.gradle
          grep -q "versionCode = 32" organicmaps/android/build.gradle
          grep -q "versionName = '0.32.0'" organicmaps/android/build.gradle
          grep -q 'NvV032Actions.install(this);' organicmaps/android/app/src/main/java/app/organicmaps/MwmActivity.java
          grep -q 'NvV032Actions.openSmartSearch' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'NvV032Actions.openRouteAlerts' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'addSmartTravelPill' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'NvAnimatedBrand.install(this);' organicmaps/android/app/src/main/java/app/organicmaps/SplashActivity.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvAnimatedBrand.java
          grep -q 'NV v0.32' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'correctedActiveEta' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'metroNetworkEstimate' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'planningLocationOkay' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'estimateMixedCostToman' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'startMixedSession' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'osrmAlternatives' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'geocodePhoton' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'onlineServicesEnabled' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'mixed_stage' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'NvV032TextParser' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'NvV032Actions.openPreferences' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java

          grep -q 'ONLINE_ETA_REFRESH_MOVE_M = 500' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'بازه بدون ترافیک زنده' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'map_prompted_region' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          grep -q 'NvLocationPolicy.GOOD_ACCURACY_M' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvLocationPolicy.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvV032TextParser.java
          test -s organicmaps/android/app/src/test/java/app/organicmaps/NvV032LogicTest.java
          ! grep -q 'NvV031Actions' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          ! grep -q 'NvV031Actions' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          ! grep -q 'ensureTehranMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java

          ! grep -q 'MAX_ROUTE_ACCURACY_M = 250' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartActions.java
          ! grep -q '۲۸ دقیقه' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          ! grep -q '۱۰:۰۳' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          grep -q 'goHome(activity)' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'destinationConfident' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'estimateMixed' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'nv_splash_logo' organicmaps/android/app/src/main/java/app/organicmaps/NvAnimatedBrand.java
          grep -q 'getSearchRadius' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartActions.java
          grep -q 'ensureCurrentRegionMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          ! grep -q 'ensureTehranMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          grep -q 'scorePlace' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'router.project-osrm.org' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          grep -q 'hasMetroNear' organicmaps/android/app/src/main/java/app/organicmaps/NvV032Actions.java
          test -s organicmaps/android/libs/branding/src/main/res/mipmap-nodpi/nv_launcher.webp

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > organicmaps/android/local.properties
          java -version
          cmake --version
          ninja --version

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nv-v032-user-friendly-arm64
          max-size: 2G

      - name: Build and test
        working-directory: organicmaps/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Parm64 :app:testWebDebugUnitTest :sdk:testDebug :app:assembleWebProfileable 2>&1 | tee /tmp/nv-v032-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.32-build-diagnostics
          path: /tmp/nv-v032-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate installable Android 16 APK
        run: |
          set -euo pipefail
          exec > >(tee /tmp/nv-v032-validation.log) 2>&1
          echo "Candidate APK files:"
          find organicmaps/android/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find organicmaps/android/app/build/outputs/apk -type f -name '*.apk' | grep -i profileable | head -n 1)
          echo "Selected APK: $APK"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/nv-v032-badging.txt
          mkdir -p dist
          cp "$APK" dist/NV-v0.32.0-user-friendly-arm64-profileable.apk
          sha256sum dist/NV-v0.32.0-user-friendly-arm64-profileable.apk | tee dist/NV-v0.32.0-user-friendly-arm64-profileable.apk.sha256
          grep -q "package: name='ir.nv.navigation.web.profileable'" /tmp/nv-v032-badging.txt
          grep -q "application-label:'NV'" /tmp/nv-v032-badging.txt
          grep -q "launchable-activity: name='app.organicmaps.SplashActivity'" /tmp/nv-v032-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/nv-v032-badging.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.32-validation-diagnostics
          path: |
            /tmp/nv-v032-validation.log
            /tmp/nv-v032-badging.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Build x86_64 smoke APK
        working-directory: organicmaps/android
        run: |
          ./gradlew --no-daemon -Px86_64 :app:assembleWebDebug

      - name: Android 16 install and launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/organicmaps/android/app/build/outputs/apk/web/debug/OrganicMaps-32-web-debug.apk"
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          test -s "$APK"
          test -x "$ADB"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          AVDMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" "system-images;android-36;default;x86_64" >/tmp/nv-v032-sdkmanager.txt 2>&1
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_RC" -eq 0
          echo "no" | "$AVDMANAGER" create avd -f -n nv_api36 -k "system-images;android-36;default;x86_64" -d pixel_6 >/tmp/nv-v032-avd-create.txt 2>&1

          "$ANDROID_SDK_ROOT/emulator/emulator" -avd nv_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off > /tmp/nv-v032-emulator.txt 2>&1 &
          EMU_PID=$!
          cleanup() {
            "$ADB" emu kill >/dev/null 2>&1 || true
            kill "$EMU_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$ADB" start-server
          ready=0
          for i in $(seq 1 150); do
            state=$("$ADB" get-state 2>/dev/null || true)
            boot=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
              ready=1
              break
            fi
            sleep 4
          done
          if [ "$ready" != "1" ]; then
            "$ADB" devices -l > /tmp/nv-v032-adb-devices.txt || true
            "$ADB" logcat -d -t 300 > /tmp/nv-v032-logcat.txt || true
            exit 1
          fi

          sleep 8
          "$ADB" shell pm list packages >/tmp/nv-v032-packages-before.txt
          "$ADB" install -r -t "$APK" | tee /tmp/nv-v032-install.txt
          "$ADB" shell pm list packages | grep -q '^package:ir.nv.navigation.web.debug$'

          "$ADB" logcat -c || true
          "$ADB" shell am force-stop ir.nv.navigation.web.debug || true
          "$ADB" shell am start -W -n ir.nv.navigation.web.debug/app.organicmaps.SplashActivity | tee /tmp/nv-v032-smoke.txt
          sleep 8

          grep -q 'Status: ok' /tmp/nv-v032-smoke.txt
          "$ADB" shell pidof ir.nv.navigation.web.debug | tee /tmp/nv-v032-pid.txt
          test -s /tmp/nv-v032-pid.txt
          "$ADB" shell dumpsys activity activities | grep -q 'ir.nv.navigation.web.debug'
          "$ADB" logcat -d -t 500 > /tmp/nv-v032-logcat.txt || true

          if grep -E 'FATAL EXCEPTION|Process: ir\.nv\.navigation\.web\.debug.*has died|AndroidRuntime:.*ir\.nv\.navigation\.web\.debug' /tmp/nv-v032-logcat.txt; then
            echo "NV process crash detected"
            exit 1
          fi

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.32-smoke-diagnostics
          path: |
            /tmp/nv-v032-smoke.txt
            /tmp/nv-v032-logcat.txt
            /tmp/nv-v032-install.txt
            /tmp/nv-v032-pid.txt
            /tmp/nv-v032-emulator.txt
            /tmp/nv-v032-adb-devices.txt
            /tmp/nv-v032-sdkmanager.txt
            /tmp/nv-v032-avd-create.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.32.0-user-friendly-arm64-profileable
          path: |
            dist/NV-v0.32.0-user-friendly-arm64-profileable.apk
            dist/NV-v0.32.0-user-friendly-arm64-profileable.apk.sha256
          if-no-files-found: error
          retention-days: 14
