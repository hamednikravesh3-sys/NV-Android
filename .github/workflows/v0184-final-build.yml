name: v0.18.4 Final APK

on:
  push:
    branches: [chatgpt/v0.18.4-integrated]
    paths:
      - '.github/workflows/v0184-final-build.yml'
      - '.final-build-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0184-final-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Backend and tooling tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_*.py'
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs
      - name: Android lint, unit tests and APK builds
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
          NV_CLOUD_API_URL: ${{ secrets.NV_CLOUD_API_URL }}
          NV_VALHALLA_API_URL: ${{ secrets.NV_VALHALLA_API_URL }}
          NV_COMMUNITY_REPORT_API_URL: ${{ secrets.NV_COMMUNITY_REPORT_API_URL }}
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            :app:assembleDebug \
            :app:testReleaseUnitTest \
            :app:assembleRelease
      - name: Align, sign and verify final APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          INPUT_APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED_APK='/tmp/app-release-aligned.apk'
          FINAL_APK='dist/Rahnama-Android16-v0.18.4.apk'
          mkdir -p dist
          test -s "$INPUT_APK"
          test -s keystore/nv-debug.jks
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$INPUT_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore/nv-debug.jks \
            --ks-pass pass:nvdebug \
            --ks-key-alias nvdebug \
            --key-pass pass:nvdebug \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK" | tee dist/apksigner.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$FINAL_APK" | tee dist/zipalign.txt
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$FINAL_APK")"
          printf '%s\n' "$BADGING" | tee dist/badging.txt
          echo "$BADGING" | grep -q "package: name='ir.nv.navigation'"
          echo "$BADGING" | grep -q "versionCode='23'"
          echo "$BADGING" | grep -q "versionName='0.18.4'"
          echo "$BADGING" | grep -q "sdkVersion:'29'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          sha256sum "$FINAL_APK" | tee dist/sha256.txt
          {
            echo "git_sha=$GITHUB_SHA"
            echo "package=ir.nv.navigation"
            echo "version_code=23"
            echo "version_name=0.18.4"
            echo "min_sdk=29"
            echo "target_sdk=36"
            cat dist/sha256.txt
          } > dist/provenance.txt
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Rahnama-Android16-v0.18.4-final
          path: dist/
          if-no-files-found: error
          retention-days: 30

  android16-smoke:
    name: Android 16 install and launch smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download final APK
        uses: actions/download-artifact@v4
        with:
          name: Rahnama-Android16-v0.18.4-final
          path: dist
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 smoke and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set -euo pipefail
            APK='dist/Rahnama-Android16-v0.18.4.apk'
            PACKAGE='ir.nv.navigation'
            ACTIVITY='ir.nv.navigation.MainActivity'
            test -s "$APK"
            adb install -r "$APK"
            adb shell pm grant "$PACKAGE" android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant "$PACKAGE" android.permission.ACCESS_COARSE_LOCATION || true
            adb emu geo fix 51.3890 35.6892 || true
            adb logcat -c || true
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/$ACTIVITY"
            sleep 12
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' | awk '{print $1}')"
            test -n "$PID"
            adb shell dumpsys activity activities > android16-activity.txt
            adb shell dumpsys window windows > android16-window.txt
            adb shell uiautomator dump /sdcard/nv-final-ui.xml || true
            adb pull /sdcard/nv-final-ui.xml android16-ui.xml || true
            adb exec-out screencap -p > android16-screen.png || true
            adb logcat -d > android16-logcat.txt
            if grep -E "FATAL EXCEPTION|ANR in $PACKAGE|Process: $PACKAGE.*has died" android16-logcat.txt; then
              echo 'Crash/ANR detected in Android 16 smoke test' >&2
              exit 1
            fi
            grep -q "$PACKAGE" android16-activity.txt
            test -s android16-ui.xml
            gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android 16 smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rahnama-v0.18.4-android16-diagnostics
          path: |
            android16-activity.txt
            android16-window.txt
            android16-ui.xml
            android16-screen.png
            android16-logcat.txt
          if-no-files-found: warn
