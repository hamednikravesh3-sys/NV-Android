name: Apply NV offline search pin fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v14-map-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested NV fixes
        shell: bash
        run: |
          echo '超' | base64 -d > /tmp/nv_patch.py
          python3 /tmp/nv_patch.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ir/nv/navigation/ui/NvReferenceV8.kt app/src/main/java/ir/nv/navigation/ui/NvReferenceV13.kt app/src/main/java/ir/nv/navigation/online/OnlinePlacesService.kt app/src/main/java/ir/nv/navigation/online/OnlineNavigationService.kt app/build.gradle.kts .github/scripts/verify-nv-launch.sh
          git commit -m "Restore NV pin switch to offline map improve search nearby"
          git push
