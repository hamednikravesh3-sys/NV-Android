name: v0.18.4 Final Artifact Verification v2

on:
  push:
    branches: [chatgpt/v0.18.4-integrated]
    paths:
      - '.artifact-verify-v2-trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v0184-artifact-verify-v2
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact final APK on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download exact final APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Rahnama-Android16-v0.18.4-final
          path: dist
          github-token: ${{ github.token }}
          repository: hamednikravesh3-sys/NV-Android
          run-id: 34955684603

      - name: Reverify exact artifact before device test
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Rahnama-Android16-v0.18.4.apk'
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee final-apksigner-recheck-v2.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee final-zipalign-recheck-v2.txt
          "$TOOLS/aapt" dump badging "$APK" | tee final-badging-recheck-v2.txt
          grep -q "package: name='ir.nv.navigation'" final-badging-recheck-v2.txt
          grep -q "versionCode='23'" final-badging-recheck-v2.txt
          grep -q "versionName='0.18.4'" final-badging-recheck-v2.txt
          grep -q "sdkVersion:'29'" final-badging-recheck-v2.txt
          grep -q "targetSdkVersion:'36'" final-badging-recheck-v2.txt
          sha256sum "$APK" | tee final-apk-sha256-v2.txt

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Android 16 product-flow and instrumentation gates
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NV_VERIFY_APK: dist/Rahnama-Android16-v0.18.4.apk
          NV_VERIFY_PACKAGE: ir.nv.navigation
          NV_VERIFY_ACTIVITY: ir.nv.navigation.MainActivity
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/verify-nv-launch-modern-v3.sh && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload Android 16 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rahnama-v0.18.4-android16-verification-v2
          path: |
            final-apksigner-recheck-v2.txt
            final-zipalign-recheck-v2.txt
            final-badging-recheck-v2.txt
            final-apk-sha256-v2.txt
            nv-modern-launch-screen.png
            nv-modern-window-state.txt
            nv-modern-activity-state.txt
            nv-modern-logcat.txt
            nv-modern-app-logcat.txt
            nv-modern-ui.xml
            nv-modern-nearby-ui.xml
            nv-modern-search-ui.xml
            nv-modern-route-ui.xml
            nv-modern-comparison-ui.xml
            nv-modern-emergency-ui.xml
          if-no-files-found: warn
          retention-days: 30
