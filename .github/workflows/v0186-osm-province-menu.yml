name: v0.18.6 OpenStreetMap Province Menu

on:
  push:
    branches: [chatgpt/v0.18.6-osm-province-menu]
    paths:
      - '.v0186-osm-province-menu-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: v0186-osm-province-menu
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.18.6-osm-province-menu
          fetch-depth: 0

      - name: Apply OpenStreetMap and province-menu changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-v0186-osm-province-menu.py
          git config user.name 'NV Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt \
            app/src/main/java/ir/nv/navigation/ui/RahnamaHome.kt \
            app/src/main/java/ir/nv/navigation/ui/ProvinceDownloadOverlay.kt
          git diff --cached --check
          git commit -m 'Switch NV base map to OpenStreetMap and separate province downloads'
          git push origin HEAD:chatgpt/v0.18.6-osm-province-menu

      - name: Verify source intent
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt
          grep -Fq '© OpenStreetMap contributors' app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt
          grep -Fq 'دانلود نقشه استان‌ها' app/src/main/java/ir/nv/navigation/ui/RahnamaHome.kt
          grep -Fq 'فهرست ۳۱ استان' app/src/main/java/ir/nv/navigation/ui/ProvinceDownloadOverlay.kt
          ! grep -Fq 'styles/liberty' app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Lint, unit tests and release build
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
        run: |
          gradle --no-daemon \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:assembleDebugAndroidTest \
            :app:assembleRelease

      - name: Sign and verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          INPUT='app/build/outputs/apk/release/app-release-unsigned.apk'
          OUTPUT='dist/NV-Android16-v0.18.6-OpenStreetMap.apk'
          mkdir -p dist
          test -s "$INPUT"
          "$TOOLS/apksigner" sign \
            --ks keystore/nv-debug.jks \
            --ks-pass pass:nvdebug \
            --ks-key-alias nvdebug \
            --key-pass pass:nvdebug \
            --out "$OUTPUT" "$INPUT"
          "$TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT" | tee dist/apksigner.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$OUTPUT" | tee dist/zipalign.txt
          "$TOOLS/aapt" dump badging "$OUTPUT" | tee dist/badging.txt
          grep -q "package: name='ir.nv.navigation'" dist/badging.txt
          grep -q "versionCode='25'" dist/badging.txt
          grep -q "versionName='0.18.6'" dist/badging.txt
          grep -q "targetSdkVersion:'36'" dist/badging.txt
          sha256sum "$OUTPUT" | tee dist/sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NV_VERIFY_APK: dist/NV-Android16-v0.18.6-OpenStreetMap.apk
          NV_VERIFY_PACKAGE: ir.nv.navigation
          NV_VERIFY_ACTIVITY: ir.nv.navigation.MainActivity
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/verify-nv-launch-modern-v3.sh && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload installable v0.18.6 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NV-Android16-v0.18.6-OpenStreetMap-final
          path: |
            dist/NV-Android16-v0.18.6-OpenStreetMap.apk
            dist/apksigner.txt
            dist/zipalign.txt
            dist/badging.txt
            dist/sha256.txt
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.18.6-osm-province-menu-failure-diagnostics
          path: |
            nv-modern-*.txt
            nv-modern-*.png
            nv-modern-*.xml
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
