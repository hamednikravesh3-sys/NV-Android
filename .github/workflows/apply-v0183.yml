name: Apply v0.18.3 Source Patch

on:
  push:
    branches:
      - nv-persian-rtl-master-spec
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nv-persian-rtl-master-spec
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.v0183.patch.part00 tools/.v0183.patch.part01 tools/.v0183.patch.part02 tools/.v0183.patch.part03 \
            | base64 -d | gzip -d > /tmp/v0183.patch
          patch --dry-run -p1 < /tmp/v0183.patch
          patch -p1 < /tmp/v0183.patch
          python -m unittest discover -s tools -p "test_*.py"
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs
          bash -n .github/scripts/verify-nv-launch-modern.sh
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/.v0183.patch.part00 tools/.v0183.patch.part01 tools/.v0183.patch.part02 tools/.v0183.patch.part03
          rm -f .github/workflows/apply-v0183.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement precise location, smart search and reference menu v0.18.3"
          git push origin HEAD:nv-persian-rtl-master-spec
