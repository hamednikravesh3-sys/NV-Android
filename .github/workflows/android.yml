name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug/release APKs
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:testReleaseUnitTest \
            :app:assembleRelease
      - name: Verify unsigned release package
        run: |
          set -euo pipefail
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          test -f "$RELEASE_APK"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$RELEASE_APK")"
          echo "$BADGING" > nv-release-badging.txt
          echo "$BADGING" | grep -q "package: name='ir.nv.navigation'"
          echo "$BADGING" | grep -q "versionCode='18'"
          echo "$BADGING" | grep -q "versionName='0.17.0'"
          echo "$BADGING" | grep -q "sdkVersion:'29'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          shasum -a 256 "$RELEASE_APK" > nv-release-sha256.txt
          {
            echo "git_sha=$GITHUB_SHA"
            echo "package=ir.nv.navigation"
            echo "version_code=18"
            echo "version_name=0.17.0"
            echo "min_sdk=29"
            echo "target_sdk=35"
            cat nv-release-sha256.txt
          } > nv-release-provenance.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release validation
        uses: actions/upload-artifact@v4
        with:
          name: NV-unsigned-release-validation
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            nv-release-badging.txt
            nv-release-sha256.txt
            nv-release-provenance.txt
          if-no-files-found: error
      - name: Install and verify NV launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/verify-nv-launch.sh
      - name: Upload NV launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-launch-diagnostics
          path: |
            nv-launch-screen.png
            nv-nearby-screen.png
            nv-offline-screen.png
            nv-pin-screen.png
            nv-code-screen.png
            nv-ui.xml
            nv-window-state.txt
            nv-activity-state.txt
            nv-logcat.txt
          if-no-files-found: warn
