name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug APK
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Install and verify NV launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/verify-nv-launch.sh
      - name: Upload NV launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-launch-diagnostics
          path: |
            nv-launch-screen.png
            nv-nearby-screen.png
            nv-offline-screen.png
            nv-pin-screen.png
            nv-code-screen.png
            nv-ui.xml
            nv-window-state.txt
            nv-activity-state.txt
            nv-logcat.txt
          if-no-files-found: warn
