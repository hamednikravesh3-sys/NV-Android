name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug APK
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Install and verify NV launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global hide_error_dialogs 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant ir.nv.navigation.debug android.permission.ACCESS_FINE_LOCATION
            adb logcat -c
            adb shell am force-stop ir.nv.navigation.debug
            adb shell am start -W -n ir.nv.navigation.debug/ir.nv.navigation.MainActivity
            sleep 20
            FOREGROUND="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true)"
            echo "$FOREGROUND"
            echo "$FOREGROUND" | grep 'ir.nv.navigation.debug'
            if adb logcat -d | grep -E 'FATAL EXCEPTION.*ir\.nv\.navigation|Process: ir\.nv\.navigation\.debug'; then
              exit 1
            fi
            adb exec-out screencap -p > nv-real-home.png
      - name: Upload verified NV screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NV-real-screenshot
          path: nv-real-home.png
          if-no-files-found: error
