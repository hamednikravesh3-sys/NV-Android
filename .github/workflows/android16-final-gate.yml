name: Android 16 Final Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android16-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final_android16:
    name: Build sign and verify Android 16 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify source regressions
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p "test_*.py"
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs
          bash -n .github/scripts/verify-nv-launch-modern.sh

      - name: Verify required live NV code registry
        env:
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
        run: |
          set -euo pipefail
          test -n "$NV_CODE_REGISTRY_URL"
          case "$NV_CODE_REGISTRY_URL" in
            https://*) ;;
            *) echo "NV_CODE_REGISTRY_URL must be a public HTTPS origin" >&2; exit 1 ;;
          esac

      - name: Install Android 16 SDK without deprecated tools package
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint test and build APKs
        env:
          NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
          NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            :app:assembleDebug \
            :app:testReleaseUnitTest \
            :app:assembleRelease

      - name: Sign and verify final Android 16 APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT_APK="app/build/outputs/apk/release/Rahnama-Android16-v0.18.2.apk"
          test -s "$INPUT_APK"
          test -s "keystore/nv-debug.jks"
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore/nv-debug.jks \
            --ks-pass pass:nvdebug \
            --ks-key-alias nvdebug \
            --key-pass pass:nvdebug \
            --out "$OUTPUT_APK" \
            "$INPUT_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT_APK" | tee rahnama-apksigner.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$OUTPUT_APK" | tee rahnama-zipalign.txt
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$OUTPUT_APK")"
          echo "$BADGING" | grep -q "package: name='ir.nv.navigation'"
          echo "$BADGING" | grep -q "versionCode='21'"
          echo "$BADGING" | grep -q "versionName='0.18.2'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          sha256sum "$OUTPUT_APK" | tee rahnama-apk-sha256.txt

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify real app flows and instrumentation on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NV_VERIFY_APK: app/build/outputs/apk/release/Rahnama-Android16-v0.18.2.apk
          NV_VERIFY_PACKAGE: ir.nv.navigation
          NV_VERIFY_ACTIVITY: ir.nv.navigation.MainActivity
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            bash .github/scripts/verify-nv-launch-modern.sh
            gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload final installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rahnama-Android16-v0.18.2-final
          path: |
            app/build/outputs/apk/release/Rahnama-Android16-v0.18.2.apk
            rahnama-apksigner.txt
            rahnama-zipalign.txt
            rahnama-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android 16 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rahnama-Android16-v0.18.2-diagnostics
          path: |
            nv-modern-launch-screen.png
            nv-modern-window-state.txt
            nv-modern-activity-state.txt
            nv-modern-logcat.txt
            nv-modern-app-logcat.txt
            nv-modern-ui.xml
            nv-modern-nearby-ui.xml
            nv-modern-search-ui.xml
            nv-modern-route-ui.xml
            nv-modern-comparison-ui.xml
            nv-modern-emergency-ui.xml
          if-no-files-found: warn
