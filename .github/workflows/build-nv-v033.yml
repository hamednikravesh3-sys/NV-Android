name: Build NV v0.33 Online First APK
# v0.33 online-first CI

concurrency:
  group: nv-v033-user-friendly-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - nv-v033-user-friendly
  workflow_dispatch:

jobs:
  build-v033:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout NV repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache
          python3 -m pip install --quiet pillow

      - name: Clone stable Organic Maps core
        run: |
          git clone --depth 1 --branch 2026.08.27-18-android --filter=blob:limit=128k https://github.com/organicmaps/organicmaps.git organicmaps
          cd organicmaps
          git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 8))

      - name: Integrate NV v0.33 online-first layer
        run: |
          set -euo pipefail
          python3 platform/patch_v033.py organicmaps
          python3 platform/patch_v027_resources.py organicmaps
          grep -q "appId = 'ir.nv.navigation'" organicmaps/android/build.gradle
          grep -q "versionCode = 33" organicmaps/android/build.gradle
          grep -q "versionName = '0.33.0'" organicmaps/android/build.gradle
          grep -q 'NvV033Actions.install(this);' organicmaps/android/app/src/main/java/app/organicmaps/MwmActivity.java
          grep -q 'NvV033Actions.openSmartSearch' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'NvV033Actions.openRouteAlerts' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'addSmartTravelPill' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'NvAnimatedBrand.install(this);' organicmaps/android/app/src/main/java/app/organicmaps/SplashActivity.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvAnimatedBrand.java
          grep -q 'NV v0.33' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'correctedActiveEta' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'metroNetworkEstimate' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'planningLocationOkay' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'startMixedSession' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'osrmAlternatives' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'geocodePhoton' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'onlineServicesEnabled' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'mixed_stage' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'NvV033TextParser' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'NvV033Actions.openPreferences' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java

          grep -q 'بازه بدون ترافیک زنده' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'NvLocationPolicy.GOOD_ACCURACY_M' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvLocationPolicy.java
          test -s organicmaps/android/app/src/main/java/app/organicmaps/NvV033TextParser.java
          test -s organicmaps/android/app/src/test/java/app/organicmaps/NvV033LogicTest.java
          grep -q "webImplementation project(':sdk:maps:world')" organicmaps/android/app/build.gradle
          grep -q 'nv-v033-search-nominatim' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'nv-v033-search-photon' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'پیاده + مترو + پیاده' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'تاکسی + مترو + ادامه مسیر' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          ! grep -q 'fuel_l100' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          ! grep -q 'fuel_price_toman' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          ! grep -q 'estimateMixedCostToman' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          ! grep -q 'map_prompted_region' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          ! grep -q 'NvV031Actions' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          ! grep -q 'NvV031Actions' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          ! grep -q 'ensureTehranMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java

          ! grep -q 'MAX_ROUTE_ACCURACY_M = 250' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartActions.java
          ! grep -q '۲۸ دقیقه' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          ! grep -q '۱۰:۰۳' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartTravelUi.java
          grep -q 'goHome(activity)' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'destinationConfident' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'estimateMixed' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'nv_splash_logo' organicmaps/android/app/src/main/java/app/organicmaps/NvAnimatedBrand.java
          grep -q 'getSearchRadius' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartActions.java
          grep -q 'ensureCurrentRegionMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          ! grep -q 'ensureTehranMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          grep -q 'scorePlace' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'router.project-osrm.org' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          grep -q 'hasMetroNear' organicmaps/android/app/src/main/java/app/organicmaps/NvV033Actions.java
          test -s organicmaps/android/libs/branding/src/main/res/mipmap-nodpi/nv_launcher.webp

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > organicmaps/android/local.properties
          java -version
          cmake --version
          ninja --version

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nv-v033-user-friendly-arm64
          max-size: 2G

      - name: Build and test
        working-directory: organicmaps/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Parm64 :app:testWebDebugUnitTest :sdk:testDebug :app:assembleWebProfileable 2>&1 | tee /tmp/nv-v033-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.33-build-diagnostics
          path: /tmp/nv-v033-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate installable Android 16 APK
        run: |
          set -euo pipefail
          exec > >(tee /tmp/nv-v033-validation.log) 2>&1
          echo "Candidate APK files:"
          find organicmaps/android/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find organicmaps/android/app/build/outputs/apk -type f -name '*.apk' | grep -i profileable | head -n 1)
          echo "Selected APK: $APK"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/World.mwm'
          unzip -l "$APK" | grep -q 'assets/WorldCoasts.mwm'
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/nv-v033-badging.txt
          mkdir -p dist
          cp "$APK" dist/NV-v0.33.0-user-friendly-arm64-profileable.apk
          sha256sum dist/NV-v0.33.0-user-friendly-arm64-profileable.apk | tee dist/NV-v0.33.0-user-friendly-arm64-profileable.apk.sha256
          grep -q "package: name='ir.nv.navigation.web.profileable'" /tmp/nv-v033-badging.txt
          grep -q "application-label:'NV'" /tmp/nv-v033-badging.txt
          grep -q "launchable-activity: name='app.organicmaps.SplashActivity'" /tmp/nv-v033-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/nv-v033-badging.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.33-validation-diagnostics
          path: |
            /tmp/nv-v033-validation.log
            /tmp/nv-v033-badging.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.33.0-user-friendly-arm64-profileable
          path: |
            dist/NV-v0.33.0-user-friendly-arm64-profileable.apk
            dist/NV-v0.33.0-user-friendly-arm64-profileable.apk.sha256
          if-no-files-found: error
          retention-days: 14
