name: Build NV v0.22 Map UI Persian Tehran APK

on:
  push:
    branches:
      - nv-organic-v022-map-ui
  workflow_dispatch:

jobs:
  build-map-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout NV repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache

      - name: Clone stable Organic Maps core
        run: |
          git clone --depth 1 --branch 2026.08.27-18-android --filter=blob:limit=128k https://github.com/organicmaps/organicmaps.git organicmaps
          cd organicmaps
          git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 8))

      - name: Integrate NV Persian map UI and Tehran default
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p organicmaps/android/app/src/main/java/app/organicmaps
          cp platform/organic-ui/NvMapMenuOverlay.java organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          root = Path('organicmaps')

          # Fix Java loop lambdas so they capture immutable query values.
          overlay = root / 'android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java'
          value = overlay.read_text(encoding='utf-8')
          value = value.replace('() -> search(items[i][1])', 'searchAction(items[i][1])')
          value = value.replace('() -> search(items[i + 1][1])', 'searchAction(items[i + 1][1])')
          marker = '    private void search(String query) {\n'
          helper = '    private Runnable searchAction(String query) {\n      return () -> search(query);\n    }\n\n'
          if marker not in value:
              raise SystemExit('NV overlay search helper anchor not found')
          value = value.replace(marker, helper + marker, 1)
          overlay.write_text(value, encoding='utf-8')

          # Keep the proven Organic Maps engine but use NV's own package id.
          build_gradle = root / 'android/build.gradle'
          text = build_gradle.read_text(encoding='utf-8')
          text = text.replace("appId = 'app.organicmaps'", "appId = 'ir.nv.navigation.om'")
          if "appId = 'ir.nv.navigation.om'" not in text:
              raise SystemExit('Failed to patch application id')
          build_gradle.write_text(text, encoding='utf-8')

          # Keep APK permission validation valid for the changed package name.
          app_gradle = root / 'android/app/build.gradle'
          text = app_gradle.read_text(encoding='utf-8')
          old = r"~/name='app\.organicmaps(\.web)?(\.debug|\.beta|\.profileable)?\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'/"
          new = r"~/name='ir\.nv\.navigation\.om(\.web)?(\.debug|\.beta|\.profileable)?\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'/"
          if old not in text:
              raise SystemExit('Organic Maps permission whitelist pattern not found')
          app_gradle.write_text(text.replace(old, new), encoding='utf-8')

          # NV name in all variants that can participate in the WebDebug build.
          for rel in [
              'android/libs/branding/src/main/res/values/donottranslate.xml',
              'android/libs/branding/src/debug/res/values/donottranslate.xml',
              'android/libs/branding/src/beta/res/values/donottranslate.xml',
          ]:
              f = root / rel
              if f.exists():
                  value = f.read_text(encoding='utf-8')
                  value = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)', r'\1NV\2', value)
                  f.write_text(value, encoding='utf-8')

          # Existing NV launcher icon from the project.
          icon_b64 = Path('platform/reference-v019-icon256.b64').read_text(encoding='utf-8').strip()
          icon = base64.b64decode(icon_b64)
          icon_dir = root / 'android/libs/branding/src/main/res/mipmap-nodpi'
          icon_dir.mkdir(parents=True, exist_ok=True)
          (icon_dir / 'nv_launcher.webp').write_bytes(icon)

          manifest = root / 'android/app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/nv_launcher"')
          manifest.write_text(text, encoding='utf-8')

          # Install the NV controls directly over the real map screen.
          mwm = root / 'android/app/src/main/java/app/organicmaps/MwmActivity.java'
          text = mwm.read_text(encoding='utf-8')
          anchor = '    setContentView(R.layout.activity_map);\n'
          if anchor not in text:
              raise SystemExit('MwmActivity map layout anchor not found')
          replacement = anchor + '    NvMapMenuOverlay.install(this);\n'
          text = text.replace(anchor, replacement, 1)
          mwm.write_text(text, encoding='utf-8')

          # Fresh installs must offer/download Tehran, not the device's current region.
          downloader = root / 'android/app/src/main/java/app/organicmaps/DownloadResourcesLegacyActivity.java'
          text = downloader.read_text(encoding='utf-8')
          anchor = '    initViewsAndListeners();\n'
          if anchor not in text:
              raise SystemExit('Downloader init anchor not found')
          tehran = '''    // NV default regional map: Tehran only on a clean installation.\n    mCurrentCountry = MapManager.nativeFindCountry(35.6892, 51.3890);\n    if (!TextUtils.isEmpty(mCurrentCountry))\n    {\n      final int nvTehranStatus = MapManager.nativeGetStatus(mCurrentCountry);\n      if (nvTehranStatus != CountryItem.STATUS_DONE)\n      {\n        UiUtils.show(mChbDownloadCountry);\n        mChbDownloadCountry.setChecked(true);\n        mChbDownloadCountry.setText(String.format(getString(R.string.download_country_ask),\n                                                  MapManager.nativeGetName(mCurrentCountry)));\n      }\n    }\n'''
          text = text.replace(anchor, anchor + tehran, 1)
          downloader.write_text(text, encoding='utf-8')

          attr = root / 'NV_ENGINE_ATTRIBUTION.txt'
          attr.write_text(
              'NV v0.22 uses the Organic Maps Project engine and OpenStreetMap data.\n'
              'NV adds a Persian map-first menu layer and selects Tehran as the initial regional map.\n'
              'Organic Maps Project: https://organicmaps.app\n'
              'Source: https://github.com/organicmaps/organicmaps\n',
              encoding='utf-8'
          )
          print('NV v0.22 map-first Persian/Tehran integration applied')
          PY

          grep -q "appId = 'ir.nv.navigation.om'" organicmaps/android/build.gradle
          grep -q 'NvMapMenuOverlay.install(this);' organicmaps/android/app/src/main/java/app/organicmaps/MwmActivity.java
          grep -q '35.6892' organicmaps/android/app/src/main/java/app/organicmaps/DownloadResourcesLegacyActivity.java
          grep -q 'MapLanguageCode.setMapLanguageCode("fa")' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'همه منوهای NV' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'searchAction(items\[i\]\[1\])' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          test -s organicmaps/android/libs/branding/src/main/res/mipmap-nodpi/nv_launcher.webp

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > organicmaps/android/local.properties
          java -version
          cmake --version
          ninja --version

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nv-organic-v022-map-ui-arm64
          max-size: 2G

      - name: Build and test
        working-directory: organicmaps/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./gradlew --no-daemon -Parm64 :app:testWebDebugUnitTest :sdk:testDebug :app:assembleWebDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find organicmaps/android/app/build/outputs/apk -type f -name 'OrganicMaps-*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/nv-v022-badging.txt
          grep -q "package: name='ir.nv.navigation.om.web.debug'" /tmp/nv-v022-badging.txt
          grep -q "application-label:'NV'" /tmp/nv-v022-badging.txt
          grep -q "launchable-activity: name='app.organicmaps.DownloadResourcesActivity'" /tmp/nv-v022-badging.txt
          mkdir -p dist
          cp "$APK" dist/NV-v0.22.0-map-ui-fa-tehran-arm64-debug.apk
          sha256sum dist/NV-v0.22.0-map-ui-fa-tehran-arm64-debug.apk | tee dist/NV-v0.22.0-map-ui-fa-tehran-arm64-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.22.0-map-ui-fa-tehran-arm64-debug
          path: |
            dist/NV-v0.22.0-map-ui-fa-tehran-arm64-debug.apk
            dist/NV-v0.22.0-map-ui-fa-tehran-arm64-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
