name: Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_BASE64: ${{ secrets.NV_KEYSTORE_BASE64 }}
      NV_KEYSTORE_PASSWORD: ${{ secrets.NV_KEYSTORE_PASSWORD }}
      NV_KEY_ALIAS: ${{ secrets.NV_KEY_ALIAS }}
      NV_KEY_PASSWORD: ${{ secrets.NV_KEY_PASSWORD }}
      NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
      NV_CLOUD_API_URL: ${{ secrets.NV_CLOUD_API_URL }}
      NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$NV_KEYSTORE_PASSWORD"
          test -n "$NV_KEY_ALIAS"
          test -n "$NV_KEY_PASSWORD"
          test -n "$NV_CLOUD_API_URL"
          test -n "$NV_CODE_REGISTRY_URL"
          case "$NV_CLOUD_API_URL" in https://*) ;; *) echo "NV_CLOUD_API_URL must use HTTPS"; exit 1;; esac
          case "$NV_CODE_REGISTRY_URL" in https://*) ;; *) echo "NV_CODE_REGISTRY_URL must use HTTPS"; exit 1;; esac

      - name: Decode keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nv-release.jks"
          test -s "$RUNNER_TEMP/nv-release.jks"
          echo "NV_KEYSTORE_FILE=$RUNNER_TEMP/nv-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and build signed release
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app-release-signature.txt
          "$AAPT" dump badging "$APK" | tee app-release-badging.txt
          grep -q "package: name='ir.nv.navigation'" app-release-badging.txt
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: NV-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            app-release-signature.txt
            app-release-badging.txt
          if-no-files-found: error
