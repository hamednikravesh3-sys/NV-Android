name: Signed Release APK

on:
  workflow_dispatch:

concurrency:
  group: nv-production-signed-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.NV_KEYSTORE_BASE64 }}
      NV_KEYSTORE_PASSWORD: ${{ secrets.NV_KEYSTORE_PASSWORD }}
      NV_KEY_ALIAS: ${{ secrets.NV_KEY_ALIAS }}
      NV_KEY_PASSWORD: ${{ secrets.NV_KEY_PASSWORD }}
      NV_RELEASE_CERT_SHA256: ${{ secrets.NV_RELEASE_CERT_SHA256 }}
      NV_TRAFFIC_API_KEY: ${{ secrets.NV_TRAFFIC_API_KEY }}
      NV_CLOUD_API_URL: ${{ secrets.NV_CLOUD_API_URL }}
      NV_CODE_REGISTRY_URL: ${{ secrets.NV_CODE_REGISTRY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$NV_KEYSTORE_PASSWORD"
          test -n "$NV_KEY_ALIAS"
          test -n "$NV_KEY_PASSWORD"
          test -n "$NV_RELEASE_CERT_SHA256"
          EXPECTED="$(printf '%s' "$NV_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$EXPECTED" =~ ^[0-9A-F]{64}$ ]] || { echo "NV_RELEASE_CERT_SHA256 must be a SHA-256 certificate fingerprint"; exit 1; }
          echo "NV_EXPECTED_CERT_SHA256=$EXPECTED" >> "$GITHUB_ENV"

      - name: Decode keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nv-release.jks"
          test -s "$RUNNER_TEMP/nv-release.jks"
          echo "NV_KEYSTORE_FILE=$RUNNER_TEMP/nv-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend and release tooling tests
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs

      - name: Validate production service configuration
        run: python tools/release_readiness.py

      - name: Probe deployed production services
        run: python tools/production_service_probe.py

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify release keystore certificate
        shell: bash
        run: |
          set -euo pipefail
          CERT="$(keytool -list -v \
            -keystore "$NV_KEYSTORE_FILE" \
            -storepass "$NV_KEYSTORE_PASSWORD" \
            -alias "$NV_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          [[ "$CERT" =~ ^[0-9A-F]{64}$ ]] || { echo "Could not read SHA-256 fingerprint from release keystore"; exit 1; }
          test "$CERT" = "$NV_EXPECTED_CERT_SHA256" || { echo "Release keystore certificate does not match pinned production certificate"; exit 1; }

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify APK signature, identity and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app-release-signature.txt
          APK_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' app-release-signature.txt | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$APK_CERT" =~ ^[0-9A-F]{64}$ ]] || { echo "Could not read SHA-256 signing certificate from APK"; exit 1; }
          test "$APK_CERT" = "$NV_EXPECTED_CERT_SHA256" || { echo "Signed APK certificate does not match pinned production certificate"; exit 1; }
          "$AAPT" dump badging "$APK" | tee app-release-badging.txt
          grep -q "package: name='ir.nv.navigation'" app-release-badging.txt
          grep -q "versionCode='18'" app-release-badging.txt
          grep -q "versionName='0.17.0'" app-release-badging.txt
          grep -q "sdkVersion:'29'" app-release-badging.txt
          grep -q "targetSdkVersion:'35'" app-release-badging.txt
          sha256sum "$APK" | tee app-release.apk.sha256
          {
            echo "git_sha=$GITHUB_SHA"
            echo "package=ir.nv.navigation"
            echo "version_code=18"
            echo "version_name=0.17.0"
            echo "min_sdk=29"
            echo "target_sdk=35"
            echo "signing_cert_sha256=$APK_CERT"
            cat app-release.apk.sha256
          } > app-release-provenance.txt

      - name: Install and verify signed release on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NV_VERIFY_PACKAGE: ir.nv.navigation
          NV_VERIFY_APK: app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/verify-nv-launch.sh

      - name: Upload signed Android 10 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-signed-release-diagnostics-android10
          path: |
            nv-launch-screen.png
            nv-nearby-screen.png
            nv-offline-screen.png
            nv-pin-screen.png
            nv-ui.xml
            nv-window-state.txt
            nv-activity-state.txt
            nv-logcat.txt
            nv-app-logcat.txt
          if-no-files-found: warn

      - name: Install and verify signed release on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NV_VERIFY_PACKAGE: ir.nv.navigation
          NV_VERIFY_APK: app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/verify-nv-launch-android15.sh

      - name: Upload signed Android 15 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NV-signed-release-diagnostics-android15
          path: |
            nv-android15-screen.png
            nv-android15-window-state.txt
            nv-android15-activity-state.txt
            nv-android15-logcat.txt
            nv-android15-app-logcat.txt
          if-no-files-found: warn

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: NV-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            app-release-signature.txt
            app-release-badging.txt
            app-release-provenance.txt
          if-no-files-found: error
