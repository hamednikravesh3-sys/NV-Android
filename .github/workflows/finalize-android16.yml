name: Finalize Android 16

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: nv-persian-rtl-master-spec
          fetch-depth: 0

      - name: Apply location startup fix once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ir/nv/navigation/ui/NvApp.kt')
          s = p.read_text(encoding='utf-8')
          marker = 'LaunchedEffect(Unit) { requestLocation(LocationAction.ORIGIN) }'
          if marker not in s:
              old = '''    DisposableEffect(billing) { onDispose { billing.close() } }
    LaunchedEffect(billingState.purchased) { viewModel.refreshEntitlement(billingState.purchased) }
'''
              new = '''    DisposableEffect(billing) { onDispose { billing.close() } }
    // Start consuming device fixes immediately when location permission is already available.
    LaunchedEffect(Unit) { requestLocation(LocationAction.ORIGIN) }
    LaunchedEffect(billingState.purchased) { viewModel.refreshEntitlement(billingState.purchased) }
'''
              if s.count(old) != 1:
                  raise SystemExit('Expected NvApp startup anchor exactly once; refusing unsafe edit')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          PY
          git diff --check
          python -m unittest discover -s tools -p 'test_*.py'

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/ir/nv/navigation/ui/NvApp.kt; then
            echo 'Source fix already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ir/nv/navigation/ui/NvApp.kt
          git commit -m 'fix: start location tracking on app launch'
          git push origin HEAD:nv-persian-rtl-master-spec
