name: Finalize Android 16

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified final Android 16 patch
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .github/final-patch-v2/READY ]]; then
            echo "Final patch is not armed; nothing to do."
            exit 0
          fi

          for i in 00 01 02 03 04 05 06 07 08; do
            test -s ".github/final-patch-v2/part.${i}"
          done

          cat .github/final-patch-v2/part.{00,01,02,03,04,05,06,07,08} > /tmp/rahnama-final.patch.xz.b64
          echo "8659121b1bce23447280c245e4fec3f47198e0f5ded74d23942944589ba3c650  /tmp/rahnama-final.patch.xz.b64" | sha256sum -c -

          base64 --decode /tmp/rahnama-final.patch.xz.b64 > /tmp/rahnama-final.patch.xz
          xz -dc /tmp/rahnama-final.patch.xz > /tmp/rahnama-final.patch
          echo "781162da104d30b7e393802fd69577adee649f0f37e8e3914cfd7e36d2c9894e  /tmp/rahnama-final.patch" | sha256sum -c -

          git apply --check /tmp/rahnama-final.patch
          git apply /tmp/rahnama-final.patch

          rm -rf .github/final-patch-v2
          rm -f .github/patches/android16-finalization.b64.*

          git diff --check
          python -m unittest discover -s tools -p 'test_*.py'
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs

          git config user.name "rahnama-android16-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
            exit 0
          fi

          git commit -m "Complete Android 16 finalization"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
