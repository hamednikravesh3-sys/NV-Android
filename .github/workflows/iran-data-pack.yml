name: Build Iran data pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_places.py"
      - "tools/build_routing.py"
      - "tools/build_pack.py"
      - ".github/workflows/iran-data-pack.yml"

permissions:
  contents: write

concurrency:
  group: iran-data-pack-v2
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OSM tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool sqlite3
          python -m pip install --disable-pip-version-check "osmium>=4,<5"
      - name: Download latest Iran source data
        run: |
          mkdir -p work dist
          curl --fail --location --retry 5 --output work/iran.osm.pbf \
            https://download.geofabrik.de/asia/iran-latest.osm.pbf
          curl --fail --location --retry 5 --output work/iran.map \
            https://download.mapsforge.org/maps/v5/asia/iran.map
          osmium fileinfo work/iran.osm.pbf | tee dist/osm-source-info.txt
      - name: Build deterministic named-place index
        run: |
          osmium tags-filter --overwrite --output work/named.osm.pbf \
            work/iran.osm.pbf n/name w/name r/name
          osmium export --overwrite --format geojsonseq \
            --output work/named.geojsonseq work/named.osm.pbf
          python tools/build_places.py work/named.geojsonseq work/places.db
      - name: Verify NV public codes are 1 to N
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('work/places.db')
          count, minimum, maximum, distinct_count = db.execute(
              'SELECT COUNT(*), MIN(code), MAX(code), COUNT(DISTINCT code) FROM places'
          ).fetchone()
          if count <= 0:
              raise SystemExit('No named places were indexed')
          if minimum != 1 or maximum != count or distinct_count != count:
              raise SystemExit(
                  f'NV code verification failed: count={count}, min={minimum}, max={maximum}, distinct={distinct_count}'
              )
          print(f'NV code index verified: every named place has one unique code from 1 to {count}')
          PY
      - name: Build directed routing graph
        run: python tools/build_routing.py work/iran.osm.pbf work/routing.db
      - name: Package and verify
        run: |
          python tools/build_pack.py \
            --map work/iran.map \
            --places work/places.db \
            --routing work/routing.db \
            --output dist/iran.nvpack
          sha256sum dist/iran.nvpack | tee dist/iran.nvpack.sha256
          python -m zipfile --test dist/iran.nvpack
          test "$(stat --format=%s dist/iran.nvpack)" -lt 2147483648
      - name: Publish map-v1 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view map-v1 >/dev/null 2>&1 || \
            gh release create map-v1 --title "NV Iran offline data" \
              --notes "Iran-only OpenStreetMap vector map, named-place index and directed offline-routing graph."
          gh release upload map-v1 dist/iran.nvpack dist/iran.nvpack.sha256 dist/osm-source-info.txt --clobber
