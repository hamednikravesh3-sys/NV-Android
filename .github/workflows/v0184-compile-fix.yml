name: v0.18.4 Compile Fix

on:
  push:
    branches: [chatgpt/v0.18.4-integrated]
    paths:
      - '.compile-fix-trigger'

permissions:
  contents: write

concurrency:
  group: v0184-compile-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix nullable vehicle animation source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt')
          text = path.read_text(encoding='utf-8')
          old = '        if (!shouldAnimate) {'
          new = '        if (!shouldAnimate || from == null) {'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one nullable animation condition, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'if (!shouldAnimate || from == null)' app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt
          git diff -- app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt
          git config user.name 'NV Compile Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/ir/nv/navigation/map/OnlineIranMap.kt
          git commit -m 'Fix nullable vehicle animation source [v0184 compile fix]'
          git push origin HEAD:chatgpt/v0.18.4-integrated
