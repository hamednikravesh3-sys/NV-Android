name: v0.18.4 Integration Bootstrap

on:
  push:
    branches: [chatgpt/v0.18.4-integrated]
    paths:
      - '.integration/v0184.ready'

permissions:
  contents: write

concurrency:
  group: v0184-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0184 integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed v0.18.4 integration
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/v0184b64.part.* | base64 -d > /tmp/v0184.patch.gz
          echo '216329b5daf23273dbc99f18f609cba46914f672874c220f62dcefe313ec905a  /tmp/v0184.patch.gz' | sha256sum -c -
          gzip -t /tmp/v0184.patch.gz
          gzip -dc /tmp/v0184.patch.gz > /tmp/v0184.patch
          echo '8a7bdf2d48e1cfbf252a3c883a729315ab7e0375efb1c4c4676d2d9e2f16dd78  /tmp/v0184.patch' | sha256sum -c -
          git apply --check -p1 /tmp/v0184.patch
          git apply -p1 /tmp/v0184.patch
          rm -rf .integration
          rm -f .github/workflows/v0184-bootstrap.yml
          git config user.name "NV Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate smart search, precise navigation and car UX [v0184 integrated]"
          git push origin HEAD:chatgpt/v0.18.4-integrated
