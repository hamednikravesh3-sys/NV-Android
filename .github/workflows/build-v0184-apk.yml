name: Build v0.18.4 APK

on:
  push:
    branches:
      - nv-persian-rtl-master-spec
    paths:
      - tools/build-v0184-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: nv-persian-rtl-master-spec
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Static source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest discover -s tools -p 'test_*.py'
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs

      - name: Gradle compile, lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | tee apk-badging.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          cp "$APK" 'NV-Android16-v0.18.4-online-first.apk'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-Android16-v0.18.4-online-first
          path: |
            NV-Android16-v0.18.4-online-first.apk
            app-debug.apk.sha256
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
