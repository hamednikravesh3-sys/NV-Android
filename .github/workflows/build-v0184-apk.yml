name: Build v0.18.4 APK

on:
  push:
    branches:
      - nv-persian-rtl-master-spec
    paths:
      - tools/build-v0184-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: nv-persian-rtl-master-spec
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Static source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest discover -s tools -p 'test_*.py'
          node --test backend/nv-code-registry/worker.test.mjs
          node --test backend/cloud-sync/worker.test.mjs

      - name: Gradle compile, lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -s "$APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          cp "$APK" 'NV-Android16-v0.18.4-online-first.apk'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-Android16-v0.18.4-online-first
          path: |
            NV-Android16-v0.18.4-online-first.apk
            app-debug.apk.sha256
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
