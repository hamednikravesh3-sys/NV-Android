name: Build NV v0.27 Smart Routing APK

on:
  push:
    branches:
      - nv-organic-v027-smart-routing
  workflow_dispatch:

jobs:
  build-v027:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout NV repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache

      - name: Clone stable Organic Maps core
        run: |
          git clone --depth 1 --branch 2026.08.27-18-android --filter=blob:limit=128k https://github.com/organicmaps/organicmaps.git organicmaps
          cd organicmaps
          git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 8))

      - name: Integrate NV v0.27 smart routing layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p organicmaps/android/app/src/main/java/app/organicmaps
          mkdir -p organicmaps/android/app/src/test/java/app/organicmaps
          cp platform/organic-ui/NvMapMenuOverlay.java organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          cp platform/organic-ui/NvRuntimeController.java organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          cp platform/organic-ui/NvCodeCodec.java organicmaps/android/app/src/main/java/app/organicmaps/NvCodeCodec.java
          cp platform/organic-ui/NvCodeCodecTest.java organicmaps/android/app/src/test/java/app/organicmaps/NvCodeCodecTest.java
          cp platform/organic-ui/NvNearbyCategory.java organicmaps/android/app/src/main/java/app/organicmaps/NvNearbyCategory.java
          cp platform/organic-ui/NvSmartActions.java organicmaps/android/app/src/main/java/app/organicmaps/NvSmartActions.java
          cp platform/organic-ui/NvV027Actions.java organicmaps/android/app/src/main/java/app/organicmaps/NvV027Actions.java

          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          root = Path('organicmaps')

          # Application id.
          f = root / 'android/build.gradle'
          t = f.read_text(encoding='utf-8').replace("appId = 'app.organicmaps'", "appId = 'ir.nv.navigation.om'")
          if "appId = 'ir.nv.navigation.om'" not in t:
              raise SystemExit('app id patch failed')
          f.write_text(t, encoding='utf-8')

          # QR/Code-128 dependency and permission whitelist.
          f = root / 'android/app/build.gradle'
          t = f.read_text(encoding='utf-8')
          old = r"~/name='app\.organicmaps(\.web)?(\.debug|\.beta|\.profileable)?\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'/"
          new = r"~/name='ir\.nv\.navigation\.om(\.web)?(\.debug|\.beta|\.profileable)?\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'/"
          if old not in t: raise SystemExit('permission whitelist anchor missing')
          t = t.replace(old, new)
          anchor = "  implementation libs.google.material\n"
          if anchor not in t: raise SystemExit('dependency anchor missing')
          t = t.replace(anchor, anchor + "  implementation 'com.google.zxing:core:3.5.3'\n", 1)
          f.write_text(t, encoding='utf-8')

          # Make every menu action distinct and use the semantic NV search from the home bar.
          f = root / 'android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java'
          t = f.read_text(encoding='utf-8')
          t = t.replace('bar.setOnClickListener(v -> NvRuntimeController.openSearch(activity, ""));',
                        'bar.setOnClickListener(v -> NvV027Actions.openSmartSearch(activity));', 1)
          t = t.replace('"هماهنگی تاکسی", "اطمینان زمان رسیدن", "مقایسه زمان و هزینه", "راهنمای پیاده", "ترجیحات سفر هوشمند"',
                        '"هماهنگی تاکسی", "اطمینان زمان رسیدن", "مقایسه زمان و مصرف", "راهنمای پیاده", "ترجیحات سفر هوشمند"')
          t = t.replace('"تعویض هوشمند ایستگاه", "حرکت زنده مترو",',
                        '"تعویض هوشمند ایستگاه", "مترو و ایستگاه‌ها",')
          pattern = re.compile(r'    private void handleMenu\(int id\) \{.*?\n    \}\n\n    private void showNearby\(\)', re.S)
          replacement = '''    private void handleMenu(int id) {
      switch (id) {
        case 1 -> { }
        case 2 -> showNearby();
        case 3 -> NvSmartActions.openNearby(activity, "اورژانس");
        case 4 -> NvV027Actions.openPlaceDetails(activity);
        case 5 -> NvV027Actions.openRouteMode(activity);
        case 6 -> NvV027Actions.openRouteAlerts(activity);
        case 7 -> NvSmartActions.openNearby(activity, "داروخانه");
        case 8 -> NvSmartActions.openNearby(activity, "پارک");
        case 9 -> NvV027Actions.openSmartSearch(activity);
        case 10 -> NvV027Actions.openCompareRoutes(activity);
        case 11 -> NvV027Actions.openRadius(activity);
        case 12 -> showSOS();
        case 13 -> NvV027Actions.openChat(activity);
        case 14 -> NvV027Actions.openHurry(activity);
        case 15 -> NvV027Actions.openMixed(activity);
        case 16 -> NvV027Actions.openStationTransfer(activity);
        case 17 -> NvV027Actions.openMetroStatus(activity);
        case 18 -> NvV027Actions.openTaxi(activity);
        case 19 -> NvV027Actions.openEta(activity);
        case 20 -> NvV027Actions.openTimeCost(activity);
        case 21 -> NvV027Actions.openWalk(activity);
        case 22 -> NvV027Actions.openPreferences(activity);
        default -> NvV027Actions.openRouteMode(activity);
      }
    }

    private void showNearby()'''
          t2, n = pattern.subn(replacement, t, count=1)
          if n != 1: raise SystemExit('menu switch patch failed')
          f.write_text(t2, encoding='utf-8')

          # Apply the radius selected by the user to real nearby queries.
          f = root / 'android/app/src/main/java/app/organicmaps/NvSmartActions.java'
          t = f.read_text(encoding='utf-8')
          t = t.replace(
              'final List<Place> places = fetchNearby(category, loc.getLatitude(), loc.getLongitude());\n        activity.runOnUiThread(() -> renderNearby(activity, ui, category, loc, places));',
              'final int radiusMeters = NvV027Actions.getSearchRadius(activity, category.radiusMeters);\n        final List<Place> places = fetchNearby(category, loc.getLatitude(), loc.getLongitude(), radiusMeters);\n        activity.runOnUiThread(() -> renderNearby(activity, ui, category, loc, places, radiusMeters));')
          t = t.replace('Location origin, List<Place> places) {', 'Location origin, List<Place> places, int radiusMeters) {', 1)
          t = t.replace('"در شعاع " + Math.round(category.radiusMeters / 1000f) + " کیلومتری موردی پیدا نشد."',
                        '"در شعاع " + Math.round(radiusMeters / 1000f) + " کیلومتری موردی پیدا نشد."')
          t = t.replace('private static List<Place> fetchNearby(NvNearbyCategory category, double lat, double lon) throws Exception {',
                        'private static List<Place> fetchNearby(NvNearbyCategory category, double lat, double lon, int radiusMeters) throws Exception {')
          t = t.replace('return geocodeNearby(category.fallbackQuery, lat, lon, category.radiusMeters);',
                        'return geocodeNearby(category.fallbackQuery, lat, lon, radiusMeters);')
          t = t.replace('return fetchNearbyFromEndpoint(endpoint, category, lat, lon);',
                        'return fetchNearbyFromEndpoint(endpoint, category, lat, lon, radiusMeters);')
          t = t.replace('double lat, double lon) throws Exception {\n    final String query = buildOverpassQuery(category, lat, lon);',
                        'double lat, double lon, int radiusMeters) throws Exception {\n    final String query = buildOverpassQuery(category, lat, lon, radiusMeters);')
          t = t.replace('if (distance > category.radiusMeters * 1.05d) continue;',
                        'if (distance > radiusMeters * 1.05d) continue;')
          t = t.replace('private static String buildOverpassQuery(NvNearbyCategory category, double lat, double lon) {\n    final String around = String.format(Locale.US, "(around:%d,%.7f,%.7f)", category.radiusMeters, lat, lon);',
                        'private static String buildOverpassQuery(NvNearbyCategory category, double lat, double lon, int radiusMeters) {\n    final String around = String.format(Locale.US, "(around:%d,%.7f,%.7f)", radiusMeters, lat, lon);')
          f.write_text(t, encoding='utf-8')

          # Runtime: clearer GPS wording and location-aware map download instead of hard-coded Tehran.
          f = root / 'android/app/src/main/java/app/organicmaps/NvRuntimeController.java'
          t = f.read_text(encoding='utf-8')
          t = t.replace('URLEncoder.encode(query, StandardCharsets.UTF_8)', 'URLEncoder.encode(query, "UTF-8")')
          t = t.replace('text = "◎  ±" + accuracy + "م";', 'text = "◎  GPS " + accuracy + "م";')
          t = t.replace('text = "⚠  ±" + accuracy + "م";', 'text = "⚠  GPS " + accuracy + "م";')
          t = t.replace('final String accuracy = loc.hasAccuracy() ? "±" + Math.round(loc.getAccuracy()) + " متر" : "نامشخص";',
                        'final String accuracy = loc.hasAccuracy() ? "خطای GPS: " + Math.round(loc.getAccuracy()) + " متر" : "نامشخص";')
          t = t.replace('loc.hasAccuracy() && loc.getAccuracy() <= 10 ? GREEN : AMBER);',
                        'loc.hasAccuracy() && loc.getAccuracy() <= 30 ? GREEN : (loc.hasAccuracy() && loc.getAccuracy() <= 100 ? AMBER : RED));')
          t = t.replace('loc.getAccuracy() > 50f', 'loc.getAccuracy() > 250f')
          t = t.replace('mainHandler.postDelayed(this::ensureTehranMap, 1600L);', 'mainHandler.postDelayed(this::ensureCurrentRegionMap, 1800L);')
          method_re = re.compile(r'  private void ensureTehranMap\(\)\n  \{.*?\n  \}\n\n  private void refreshLocationChip', re.S)
          method_new = '''  private void ensureCurrentRegionMap()
  {
    if (destroyed)
      return;
    try
    {
      final Location loc = locationHelper.getSavedLocation();
      if (loc == null || System.currentTimeMillis() - loc.getTime() > 180000L)
        return;
      final String id = MapManager.nativeFindCountry(loc.getLatitude(), loc.getLongitude());
      if (TextUtils.isEmpty(id))
        return;
      final int status = MapManager.nativeGetStatus(id);
      if (status == CountryItem.STATUS_DOWNLOADABLE || status == CountryItem.STATUS_PARTLY)
        MapManager.startDownload(id);
      else if (status == CountryItem.STATUS_FAILED)
        MapManager.retryDownload(id);
      else if (status == CountryItem.STATUS_UPDATABLE)
        MapManager.startUpdate(id);
    }
    catch (Throwable ignored) {}
  }

  private void refreshLocationChip'''
          t2, n = method_re.subn(method_new, t, count=1)
          if n != 1: raise SystemExit('current-region map patch failed')
          t = t2.replace(
              '    customLayer.setClickable(true);\n    updateBaseVisibility();\n  }\n\n  private void beginSheet',
              '    customLayer.setClickable(true);\n    customLayer.setOnClickListener(null);\n    updateBaseVisibility();\n  }\n\n  private void beginSheet', 1)
          f.write_text(t, encoding='utf-8')

          # Branding.
          for rel in [
              'android/libs/branding/src/main/res/values/donottranslate.xml',
              'android/libs/branding/src/debug/res/values/donottranslate.xml',
              'android/libs/branding/src/beta/res/values/donottranslate.xml',
          ]:
              f = root / rel
              if f.exists():
                  s = f.read_text(encoding='utf-8')
                  s = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)', r'\1NV\2', s)
                  f.write_text(s, encoding='utf-8')
          icon = base64.b64decode(Path('platform/reference-v019-icon256.b64').read_text(encoding='utf-8').strip())
          icon_dir = root / 'android/libs/branding/src/main/res/mipmap-nodpi'
          icon_dir.mkdir(parents=True, exist_ok=True)
          (icon_dir / 'nv_launcher.webp').write_bytes(icon)

          # Launcher remains SplashActivity.
          f = root / 'android/app/src/main/AndroidManifest.xml'
          t = f.read_text(encoding='utf-8').replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/nv_launcher"')
          launcher = '      <intent-filter>\n        <action android:name="android.intent.action.MAIN"/>\n        <category android:name="android.intent.category.LAUNCHER"/>\n      </intent-filter>\n'
          if launcher not in t: raise SystemExit('launcher filter missing')
          t = t.replace(launcher, '', 1)
          splash = '    <activity\n      android:name="app.organicmaps.SplashActivity"\n      android:theme="@style/MwmTheme.Splash"\n      android:configChanges="orientation|screenSize|smallestScreenSize|density|screenLayout|uiMode|keyboard|keyboardHidden|navigation"\n      android:screenOrientation="fullUser"\n      android:exported="true">\n'
          if splash not in t: raise SystemExit('splash anchor missing')
          t = t.replace(splash, splash + '\n' + launcher, 1)
          f.write_text(t, encoding='utf-8')

          # Install NV layers on the real map Activity.
          f = root / 'android/app/src/main/java/app/organicmaps/MwmActivity.java'
          t = f.read_text(encoding='utf-8')
          anchor = '    setContentView(R.layout.activity_map);\n'
          if anchor not in t: raise SystemExit('MwmActivity anchor missing')
          t = t.replace(anchor, anchor + '    NvMapMenuOverlay.install(this);\n    NvRuntimeController.install(this);\n    NvV027Actions.install(this);\n', 1)
          f.write_text(t, encoding='utf-8')

          # Persian overrides for the routing errors and the most visible planning labels.
          routing_fa = root / 'android/libs/routing/src/main/res/values-fa'
          routing_fa.mkdir(parents=True, exist_ok=True)
          (routing_fa / 'nv_strings.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<resources>
  <string name="transit_not_found">مسیریابی مترو در این منطقه در دسترس نیست</string>
  <string name="dialog_pedestrian_route_is_long_header">مسیر مترو پیدا نشد</string>
  <string name="dialog_pedestrian_route_is_long_message">مبدا یا مقصد را به یک ایستگاه مترو نزدیک‌تر انتخاب کنید</string>
  <string name="dialog_routing_check_gps">سیگنال GPS را بررسی کنید</string>
  <string name="dialog_routing_cant_build_route">امکان ساخت مسیر وجود ندارد.</string>
  <string name="dialog_routing_change_start_or_end">مبدا یا مقصد را اصلاح کنید.</string>
  <string name="navigation_stop_button">توقف</string>
  <string name="ok">تأیید</string>
</resources>''', encoding='utf-8')

          sdk_fa = root / 'android/sdk/src/main/res/values-fa'
          sdk_fa.mkdir(parents=True, exist_ok=True)
          (sdk_fa / 'nv_strings.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<resources>
  <string name="core_my_position">موقعیت من</string>
  <string name="core_placepage_unknown_place">نقطه روی نقشه</string>
  <string name="subway_data_unavailable">اطلاعات مترو در دسترس نیست</string>
  <string name="m">متر</string>
  <string name="km">کیلومتر</string>
</resources>''', encoding='utf-8')

          app_fa = root / 'android/app/src/main/res/values-fa'
          app_fa.mkdir(parents=True, exist_ok=True)
          (app_fa / 'nv_strings.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<resources>
  <string name="search">جستجو</string>
  <string name="search_map">جستجو روی نقشه</string>
  <string name="download">دانلود</string>
  <string name="download_resources">برای شروع، نقشه کلی جهان را دانلود کنید.\\nاین فایل %s از حافظه را استفاده می‌کند.</string>
  <string name="download_resources_continue">رفتن به نقشه</string>
  <string name="download_country_ask">نقشه %s دانلود شود؟</string>
  <string name="update_country_ask">نقشه %s به‌روزرسانی شود؟</string>
  <string name="placepage_add_stop">افزودن توقف</string>
  <string name="p2p_from_here">انتخاب مبدا</string>
  <string name="p2p_to_here">انتخاب مقصد</string>
</resources>''', encoding='utf-8')

          (root / 'NV_ENGINE_ATTRIBUTION.txt').write_text(
              'NV v0.27 uses Organic Maps/OpenStreetMap. Smart search adds semantic ranking; railway destinations are separated from subway routing; mixed trips verify nearby metro stations; ETA blends routing time with live device speed; nearby radius is user-selectable.\n',
              encoding='utf-8')
          print('NV v0.27 integration applied')
          PY

          grep -q "appId = 'ir.nv.navigation.om'" organicmaps/android/build.gradle
          grep -q 'NvV027Actions.install(this);' organicmaps/android/app/src/main/java/app/organicmaps/MwmActivity.java
          grep -q 'NvV027Actions.openSmartSearch' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'NvV027Actions.openRouteAlerts' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'NvV027Actions.openMixed' organicmaps/android/app/src/main/java/app/organicmaps/NvMapMenuOverlay.java
          grep -q 'getSearchRadius' organicmaps/android/app/src/main/java/app/organicmaps/NvSmartActions.java
          grep -q 'ensureCurrentRegionMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          ! grep -q 'ensureTehranMap' organicmaps/android/app/src/main/java/app/organicmaps/NvRuntimeController.java
          grep -q 'scorePlace' organicmaps/android/app/src/main/java/app/organicmaps/NvV027Actions.java
          grep -q 'router.project-osrm.org' organicmaps/android/app/src/main/java/app/organicmaps/NvV027Actions.java
          grep -q 'hasMetroNear' organicmaps/android/app/src/main/java/app/organicmaps/NvV027Actions.java
          grep -q 'core_my_position">موقعیت من' organicmaps/android/sdk/src/main/res/values-fa/nv_strings.xml
          test -s organicmaps/android/libs/branding/src/main/res/mipmap-nodpi/nv_launcher.webp

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > organicmaps/android/local.properties
          java -version
          cmake --version
          ninja --version

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nv-organic-v027-smart-routing-arm64
          max-size: 2G

      - name: Build and test
        working-directory: organicmaps/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./gradlew --no-daemon -Parm64 :app:testWebDebugUnitTest :sdk:testDebug :app:assembleWebDebug

      - name: Validate installable Android 16 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find organicmaps/android/app/build/outputs/apk -type f -name 'OrganicMaps-*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/nv-v027-badging.txt
          grep -q "package: name='ir.nv.navigation.om.web.debug'" /tmp/nv-v027-badging.txt
          grep -q "application-label:'NV'" /tmp/nv-v027-badging.txt
          grep -q "launchable-activity: name='app.organicmaps.SplashActivity'" /tmp/nv-v027-badging.txt
          grep -q "locales:.*'fa'" /tmp/nv-v027-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/nv-v027-badging.txt
          mkdir -p dist
          cp "$APK" dist/NV-v0.27.0-smart-routing-arm64-debug.apk
          sha256sum dist/NV-v0.27.0-smart-routing-arm64-debug.apk | tee dist/NV-v0.27.0-smart-routing-arm64-debug.apk.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-v0.27.0-smart-routing-arm64-debug
          path: |
            dist/NV-v0.27.0-smart-routing-arm64-debug.apk
            dist/NV-v0.27.0-smart-routing-arm64-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
